name: CI

on:
  pull_request:
    branches: [main]

# Aucun secret applicatif n'est nécessaire : la CI lint, teste et build l'image —
# elle ne la fait jamais tourner, donc pas de clé API ni d'URL du homelab ici.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # `ruff check` uniquement : le projet n'est volontairement pas ruff-format-clean.
      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest

  docker-build:
    name: Build image (sans push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
